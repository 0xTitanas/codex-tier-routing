name: Feature request
description: Propose a bounded improvement
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem without prescribing a large redesign.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Security and compatibility boundary
      description: Note any change to routes, permissions, local state, or supported platforms.
    validations:
      required: true
