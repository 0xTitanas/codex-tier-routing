name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Verify release tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install development tools
        run: python3 -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check scripts tests bin/codex-tier.py

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13", "3.14"]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Harden macOS Python framework permissions
        if: runner.os == 'macOS'
        shell: bash
        run: |
          FRAMEWORK_VERSIONS="$(python3 -c 'from pathlib import Path; import sys; print(Path(sys.base_prefix).resolve().parent)')"
          test "$(basename "$FRAMEWORK_VERSIONS")" = "Versions"
          sudo chmod g-w "$FRAMEWORK_VERSIONS"
      - name: Validate repository
        run: python3 scripts/validate.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check shell syntax
        run: |
          sh -n install.sh
          sh -n bin/codex-tier
      - name: Compile Python sources
        run: |
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/codex-tier-pycache" python3 -m py_compile \
            bin/codex-tier.py \
            scripts/validate.py \
            tests/test_codex_tier.py \
            tests/test_installer.py \
            tests/test_validate.py
      - name: Exercise strict installer dry-run
        run: |
          TEST_CODEX_HOME="$(python3 -c 'import os,tempfile; print(os.path.realpath(tempfile.mkdtemp()))')"
          trap 'rm -rf "$TEST_CODEX_HOME"' EXIT
          CODEX_TIER_PYTHON_BIN="$(python3 -c 'import os,sys; print(os.path.realpath(sys.executable))')" \
            ./install.sh --strict --dry-run --codex-home "$TEST_CODEX_HOME"
      - name: Verify source tree unchanged
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
